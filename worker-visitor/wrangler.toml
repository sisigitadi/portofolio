name = "portofolio-visitor-tracker"
main = "worker.js"
compatibility_date = "2024-11-01"

# ============================================================
# Deploy steps (from this folder):
#   1) npx wrangler d1 create portofolio-visits
#        -> copy the returned database_id into [[d1_databases]] below
#   2) npx wrangler d1 execute portofolio-visits --remote --file=schema.sql
#   3) npx wrangler kv namespace create VISITS
#        -> copy the returned id into [[kv_namespaces]] below
#   4) npx wrangler secret put DASHBOARD_KEY     (long random string — guards the private dashboard)
#      npx wrangler secret put IP_HASH_SALT      (random salt for IP hashing — never commit a real value)
#   5) npx wrangler deploy
#   6) In index.html, set WORKER_URL to the deployed https://<name>.<subdomain>.workers.dev
#
# NOTE: There is intentionally NO [vars] block in this file: a [vars] entry with the
# same name as a secret OVERWRITES the remote secret on every deploy (confirmed during
# first deployment). Secrets are the single source of truth — keep them in `wrangler secret put`.
# ============================================================

[[d1_databases]]
binding = "DB"
database_name = "portofolio-visits"
database_id = "e1960a8e-ab18-4425-8033-79c80de03339"

[[kv_namespaces]]
binding = "VISITS"
id = "5ba79cab92c848b4bf55d1a7b885cf70"
