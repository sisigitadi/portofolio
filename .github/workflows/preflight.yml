# ---------------------------------------------------------------------------
# Pre-Flight Audit & Unit Tests — CI Gate (GitHub Actions)
#
# Menjalankan dua gerbang di setiap push ke main dan setiap pull request:
#   1. audit.py lengkap (12 pemeriksaan) — struktur/sanitasi index.html.
#   2. pytest penuh (52 test: test_audit.py 20 + test_indexnow_ping.py 32) —
#      perilaku audit & script IndexNow.
# Jika salah satu gagal (exit != 0), workflow gagal dan push/PR diblokir.
#
# Jalur lokal yang setara:
#     python audit.py           # audit penuh (wajib 12/12 PASS)
#     python audit.py --quick   # tanpa node --check (untuk pre-commit)
#     python -m pytest test_audit.py test_indexnow_ping.py -q
# ---------------------------------------------------------------------------
name: preflight-audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # izin trigger manual dari tab Actions

jobs:
  audit:
    name: Pre-Flight Audit (12 checks) + pytest (52 tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Pre-Flight Audit
        run: python audit.py

      - name: Run Unit Tests (pytest)
        run: |
          python -m pip install --quiet pytest
          python -m pytest test_audit.py test_indexnow_ping.py -q
