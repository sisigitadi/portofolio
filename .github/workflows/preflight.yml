# ---------------------------------------------------------------------------
# Pre-Flight Audit & Unit Tests — CI Gate (GitHub Actions)
#
# Runs three gates on every push to main and every pull request:
#   1. Full audit.py (15 checks, feature-conditional) — structure/sanitation of
#      index.html (legacy SPA or single-language Field Manual).
#   2. Full pytest (72 tests: test_audit.py 40 + test_indexnow_ping.py 32) —
#      audit & IndexNow script behavior.
#   3. Visitor worker route tests (31 tests, node --test worker-visitor/worker.test.js) —
#      /count, /hit, /pixel, /api/stats, /api/export, /dashboard (auth, rate-limit,
#      10 KB body guard, fail-closed IP_HASH_SALT, CORS).
# If any of them fails (exit != 0), the workflow fails and the push/PR is blocked.
#
# Local equivalent:
#     python audit.py           # full audit (must be 15/15 PASS)
#     python audit.py --quick   # skips node --check (for pre-commit)
#     python -m pytest test_audit.py test_indexnow_ping.py -q
#     node --test worker-visitor/worker.test.js
# ---------------------------------------------------------------------------
name: preflight-audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  audit:
    name: Pre-Flight Audit (15 checks) + pytest (72 tests) + worker tests (31)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (pinned)
        with:
          python-version: "3.12"

      - name: Run Pre-Flight Audit
        run: python audit.py

      - name: Run Unit Tests (pytest)
        run: |
          python -m pip install --quiet pytest
          python -m pytest test_audit.py test_indexnow_ping.py -q

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (pinned)
        with:
          node-version: "20"

      - name: Run Visitor Worker Route Tests (node --test)
        run: node --test worker-visitor/worker.test.js
