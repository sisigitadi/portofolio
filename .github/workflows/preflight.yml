# ---------------------------------------------------------------------------
# Pre-Flight Audit & Unit Tests — CI Gate (GitHub Actions)
#
# Menjalankan tiga gerbang di setiap push ke main dan setiap pull request:
#   1. audit.py lengkap (13 pemeriksaan, feature-conditional) — struktur/sanitasi
#      index.html (SPA lama maupun Field Manual satu-bahasa).
#   2. pytest penuh (62 test: test_audit.py 30 + test_indexnow_ping.py 32) —
#      perilaku audit & script IndexNow.
#   3. Route tests visitor worker (26 test, node --test worker-visitor/worker.test.js) —
#      /count, /hit, /pixel, /api/stats, /api/export, /dashboard (auth, rate-limit,
#      body guard 10 KB, fail-closed IP_HASH_SALT, CORS).
# Jika salah satu gagal (exit != 0), workflow gagal dan push/PR diblokir.
#
# Jalur lokal yang setara:
#     python audit.py           # audit penuh (wajib 13/13 PASS)
#     python audit.py --quick   # tanpa node --check (untuk pre-commit)
#     python -m pytest test_audit.py test_indexnow_ping.py -q
#     node --test worker-visitor/worker.test.js
# ---------------------------------------------------------------------------
name: preflight-audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # izin trigger manual dari tab Actions

jobs:
  audit:
    name: Pre-Flight Audit (13 checks) + pytest (62 tests) + worker tests (26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (pinned)
        with:
          python-version: "3.12"

      - name: Run Pre-Flight Audit
        run: python audit.py

      - name: Run Unit Tests (pytest)
        run: |
          python -m pip install --quiet pytest
          python -m pytest test_audit.py test_indexnow_ping.py -q

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (pinned)
        with:
          node-version: "20"

      - name: Run Visitor Worker Route Tests (node --test)
        run: node --test worker-visitor/worker.test.js
