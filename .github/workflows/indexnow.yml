name: indexnow-ping

# Send an IndexNow ping every time content is pushed to main, so Bing & other
# search engines participating in IndexNow know immediately that a URL changed (crawl soon,
# not on schedule). The script waits for GitHub Pages to finish rebuilding
# (compares sha256 of live content vs index.html) before sending the ping.
#
# Status 200/202 = success. Failures (invalid key, etc.) only affect
# this workflow — they do NOT block the push (informational only).

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the Actions tab

permissions:
  contents: read

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (pinned)
        with:
          python-version: "3.12"

      - name: Ping IndexNow (after Pages deploy)
        run: python indexnow-ping.py --wait-sha index.html --wait-timeout 420
